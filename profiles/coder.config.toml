# The inspected Codex CLI 0.149.1 layers this file over the user's base config when started
# with `codex --profile coder`. The installer appends prompts/coder.md as
# `developer_instructions`. This is a reusable role profile; live Herdr names may
# be `coder` or `<team-prefix>-coder`.

model = "gpt-6.2-sol"
model_reasoning_effort = "xhigh"
approval_policy = "never"

# Herdr owns the visible role topology. Remove Codex-native collaboration tools
# so Coder cannot create hidden workers outside the managed Team.
agents.enabled = false

# Permit outbound commands such as SSH while retaining workspace-only local
# writes. Permission profiles are beta; start.sh verifies the effective
# sandbox and network state before creating a Herdr workspace.
default_permissions = "herdr_workspace_network"
permissions.herdr_workspace_network.extends = ":workspace"
permissions.herdr_workspace_network.network.enabled = true

# Per-conversation SSH destination shared by the three roles.
mcp_servers.herdr_team_ssh.command = "__HERDR_CODEX_TEAM_PYTHON__"
mcp_servers.herdr_team_ssh.args = ["__HERDR_CODEX_TEAM_BRIDGE__", "--ssh", "coder"]
mcp_servers.herdr_team_ssh.env_vars = ["HOME", "PATH", "CODEX_HOME", "HERDR_BIN_PATH", "HERDR_ENV", "HERDR_TEAM_RUN_ID", "HERDR_PANE_ID", "HERDR_SOCKET_PATH", "HERDR_SESSION", "HERDR_SSH_CONFIG", "SSH_AUTH_SOCK"]
mcp_servers.herdr_team_ssh.enabled_tools = ["remote_context", "ssh_read", "ssh_run"]
mcp_servers.herdr_team_ssh.default_tools_approval_mode = "approve"
mcp_servers.herdr_team_ssh.tool_timeout_sec = 135
